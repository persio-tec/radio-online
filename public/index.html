<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rádio Costa — ao vivo</title>
  <meta name="description" content="Rádio Costa — a rádio online com a melhor programação.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
</head>
<body>

  <header>
    <div class="logo">🌊 <span id="station-name">Rádio Costa</span></div>
    <span class="on-air" id="on-air">● NO AR</span>
  </header>

  <main>
    <!-- ======== PLAYER ======== -->
    <section class="player-card">
      <div class="cover" id="cover">🎵</div>

      <h1 id="track-title">Carregando programação…</h1>
      <p id="track-artist">aguarde um instante</p>

      <canvas id="visualizer" height="90"></canvas>

      <div class="seek-row">
        <span id="time-current">0:00</span>
        <input id="seek" type="range" min="0" max="100" value="0" step="0.1">
        <span id="time-duration">0:00</span>
      </div>

      <div class="controls">
        <button id="btn-shuffle" title="Embaralhar">🔀</button>
        <button id="btn-prev" title="Faixa anterior">⏮</button>
        <button id="btn-play" class="big" title="Tocar / Pausar">▶️</button>
        <button id="btn-next" title="Próxima faixa">⏭</button>
        <button id="btn-repeat" title="Repetir: desligado">🔁</button>
      </div>

      <div class="volume-row">
        <span>🔈</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
        <span>🔊</span>
      </div>
    </section>

    <!-- ======== PROGRAMAÇÃO ======== -->
    <section class="playlist-box">
      <h2>🎵 Programação</h2>
      <ul id="playlist"></ul>
      <p class="empty" id="empty-msg" hidden>
        A programação ainda está vazia.<br>
        O administrador ainda não importou músicas —
        entre no painel <a href="/admin">/admin</a> para importar.
      </p>
    </section>
  </main>

  <footer>
    <p>📻 <span id="footer-name">Rádio Costa</span> — músicas hospedadas pelo administrador da rádio.</p>
  </footer>

  <audio id="audio" preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
